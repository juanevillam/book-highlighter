<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <meta name="chrome" content="nointentdetection" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Highlighter" />
    <!-- Apply Appearance choice before first paint so light pages never flash dark. -->
    <script>
      (function () {
        var t = 'system';
        try {
          t = localStorage.getItem('bookhighlighter.theme') || 'system';
        } catch (e) {}
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta
      name="description"
      content="Scan physical book highlights, organize summaries by chapter, and read offline like a book."
    />
    <title>Book Highlighter</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Book Highlighter" />
    <meta property="og:title" content="Book Highlighter" />
    <meta
      property="og:description"
      content="Scan physical book highlights with sticky notes, organize summaries chapter by chapter, and read them offline like a book."
    />
    <meta
      property="og:url"
      content="https://bookhighlighter.juanevillam.com/"
    />
    <meta
      property="og:image"
      content="https://bookhighlighter.juanevillam.com/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="The Book Highlighter app icon" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
